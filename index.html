<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>佛教慈濟大學校園導覽</title>
<style>
:root{
  --ink:#1f2d2a; --muted:#5d6f6a; --bg:#f3f7f4; --card:#ffffff; --accent:#2f7d6b; --line:#d5e2dc;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#e7f0ec; --muted:#9db1aa; --bg:#121a18; --card:#1b2623; --accent:#6cc4ae; --line:#2b3a36; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;line-height:1.7}
header{padding:40px 20px 24px;max-width:960px;margin:0 auto}
h1{font-size:clamp(1.8rem,5vw,2.8rem);margin:0 0 6px;letter-spacing:.08em}
header p{margin:0;color:var(--muted);font-family:system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:0 20px 48px;display:grid;gap:28px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
figure.map{border-left:6px solid var(--accent)}
img{display:block;width:100%;height:auto;cursor:zoom-in}
figcaption{padding:12px 16px;font-size:.95rem;color:var(--muted)}
.row{display:grid;gap:28px;grid-template-columns:1fr 1fr}
@media (max-width:640px){.row{grid-template-columns:1fr}}
#box{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#box.on{display:flex}
#box img{max-width:100%;max-height:100%;width:auto;cursor:zoom-out}
a:focus-visible,img:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
footer{text-align:center;color:var(--muted);padding:0 20px 40px;font-family:system-ui,sans-serif;font-size:.85rem}
</style>
</head>

<footer>點擊任一圖片可放大,再點一下關閉。</footer>
<div id="box" role="dialog" aria-label="放大圖片"><img alt=""></div>
<script>
(function(){
  var box=document.getElementById('box'), big=box.querySelector('img');
  document.querySelectorAll('main img').forEach(function(im){
    function open(){big.src=im.src;big.alt=im.alt;box.classList.add('on');}
    im.addEventListener('click',open);
    im.addEventListener('keydown',function(e){if(e.key==='Enter')open();});
  });
  box.addEventListener('click',function(){box.classList.remove('on');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')box.classList.remove('on');});
})();
</script>
